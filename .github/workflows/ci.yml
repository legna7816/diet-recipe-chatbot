# ============================================================
# GitHub Actions CI 파이프라인
# 위치: .github/workflows/ci.yml
# 동작: main 브랜치에 push하면 자동으로 빌드 + 테스트 실행
# ============================================================

name: RAG API CI

# ------------------------------------------------------------
# 언제 실행할지 (트리거)
# ------------------------------------------------------------
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================
  # Job 1: 코드 검증 (빠른 피드백용)
  # ============================================================
  test:
    runs-on: ubuntu-latest   # GitHub이 제공하는 깨끗한 우분투 VM

    steps:
      # 레포 코드를 VM으로 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # Python 환경 세팅
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 패키지 설치
      # pip 캐시를 사용해 매번 재다운로드하지 않도록 함 (빌드 시간 단축)
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 문법 오류 검사 (실제 실행 없이 코드가 파싱되는지만 확인)
      # ML 모델 로딩은 시간이 오래 걸리므로 CI에서는 생략
      - name: Check syntax
        run: python -m py_compile main.py

      # 코드 스타일 검사 (선택적이지만 실무에서 흔함)
      - name: Lint with flake8
        run: |
          pip install flake8
          # E501(줄 길이)은 무시, 심각한 오류만 체크
          flake8 main.py --count --select=E9,F63,F7,F82 --show-source --statistics

  # ============================================================
  # Job 2: Docker 이미지 빌드 검증
  # ============================================================
  docker-build:
    runs-on: ubuntu-latest
    needs: test   # test job이 성공해야 실행됨 (Jenkins의 stage 순서와 같은 개념)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker Buildx: 고급 빌드 기능 + 캐싱 지원
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 이미지 빌드 (push는 하지 않고 빌드 성공 여부만 확인)
      # GitHub Actions 캐시를 사용해 레이어 재사용 -> 빌드 시간 단축
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: rag-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
